# MobileNetV3-Small Verifier Configuration
# Second-stage candidate verifier for NEMO.

model:
  name: mobilenet_v3_small
  input_channels: 1    # 1-channel sonar crop
  num_classes: 2       # 0=natural, 1=artificial
  image_size: 128
  pretrained: false    # set true if adapting from ImageNet weights

classes:
  0: natural
  1: artificial

training:
  epochs: 50
  batch_size: 64
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 2
  early_stopping_patience: 15

  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.2
    rotation: 15
    intensity_jitter: 0.3
    random_erasing: 0.1

dataset:
  positive_class: artificial
  negative_class: natural
  hard_negatives_dir: data/hard_negatives/
  val_split: 0.15
