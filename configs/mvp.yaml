# NEMO MVP Configuration
# This is the validated default configuration for the NEMO submission.
# Based on T1-T4 experiment results.

project:
  name: NEMO
  version: "0.1.0-mvp"

runtime:
  device: auto   # auto | cuda | mps | cpu
  seed: 42
  num_workers: 4

input:
  mode: recorded   # recorded | live
  image_size: 640
  channels: 1

# MVP preprocessing: raw native 1-channel input.
# The preprocessing framework supports multiple sonar enhancement strategies.
# Based on the completed T1/T3 ablation experiments, the validated MVP uses
# native 1-channel sonar input with standard resizing/letterboxing.
# Normalization and contrast-enhancement variants remain available as
# research extensions.
preprocessing:
  grayscale: true
  normalize: false    # raw native input (T3 validated)
  denoise:
    enabled: false
  contrast:
    enabled: false
  image_size: 640

# Validated MVP detector: YOLO11n-1C
# Selected based on T1 (input representation) and T2 (model scale) experiments.
detector:
  architecture: yolo11n_1c
  weights: models/yolo11/weights/yolo11n_1c.pt
  num_classes: 1
  confidence_threshold: 0.25
  nms_iou: 0.70
  input_channels: 1
  image_size: 640
  classes:
    0: target

# Validated MVP verifier: MobileNetV3-Small
# T4 experiment demonstrated ~15.79% FP reduction with retained recall.
verifier:
  architecture: mobilenet_v3_small
  weights: models/mobilenetv3/weights/mobilenetv3_verifier.pt
  enabled: true
  crop_size: 128
  bbox_padding: 0.15
  confidence_threshold: 0.50

scoring:
  artificialness:
    detector_weight: 0.35
    verifier_weight: 0.45
    contrast_weight: 0.10
    geometry_weight: 0.10
  priority:
    artificialness_weight: 0.70
    mission_confidence_weight: 0.20
    metadata_quality_weight: 0.10

metadata:
  gps_enabled: true
  timestamp_enabled: true
  heading_enabled: true

dashboard:
  enabled: true
  host: localhost
  port: 8000

output:
  directory: outputs/
  save_crops: true
  save_json: true
  save_csv: true

data:
  splits_dir: data/splits/
  hard_negatives_dir: data/hard_negatives/
  split:
    strategy: mission_grouped
    train: 0.70
    val: 0.15
    test: 0.15
    seed: 42
